<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بصمة صفية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.14.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.14.1/firebase-firestore-compat.min.js"></script>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --ink:#2E2418;
    --ink-2:#4A3826;
    --ink-soft:#66584A;
    --paper:#FBF7F0;
    --surface:#FFFFFF;
    --line:#EADFCB;
    --gold:#E8912D;
    --gold-deep:#A85D0C;
    --gold-ink:#33200A;
    --teal:#1F7A6D;
    --teal-soft:#E4F1EE;
    --coral:#E1594A;
    --coral-soft:#FBEAE7;
    --green:#3B8F63;
    --green-soft:#E7F3EC;
    --silver:#9AA5AC;
    --bronze:#B4713E;
    --shadow: 0 10px 30px -12px rgba(46,36,24,0.18);
    --shadow-sm: 0 4px 14px -8px rgba(46,36,24,0.20);
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ink:#EFE9DA; --ink-2:#D8CDAF; --ink-soft:#B9C4C9;
      --paper:#0E1B22; --surface:#152A34; --line:#26424E;
      --gold:#F0B94F; --gold-deep:#F0B94F; --gold-ink:#2A1D06;
      --teal:#3FB2A8; --teal-soft:#173934;
      --coral:#F0806F; --coral-soft:#3A1F1B;
      --green:#63C08D; --green-soft:#173a2a;
      --silver:#8FA0A8; --bronze:#C98C5E;
      --shadow: 0 10px 30px -12px rgba(0,0,0,0.55);
      --shadow-sm: 0 4px 14px -8px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --ink:#EFE9DA; --ink-2:#D8CDAF; --ink-soft:#B9C4C9;
    --paper:#0E1B22; --surface:#152A34; --line:#26424E;
    --gold:#F0B94F; --gold-deep:#F0B94F; --gold-ink:#2A1D06;
    --teal:#3FB2A8; --teal-soft:#173934;
    --coral:#F0806F; --coral-soft:#3A1F1B;
    --green:#63C08D; --green-soft:#173a2a;
    --silver:#8FA0A8; --bronze:#C98C5E;
    --shadow: 0 10px 30px -12px rgba(0,0,0,0.55);
    --shadow-sm: 0 4px 14px -8px rgba(0,0,0,0.55);
  }
  *{border-color:var(--line);}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Tajawal',system-ui,sans-serif;
    margin:0; min-height:100%;
  }
  h1,h2,h3,.font-display{font-family:'Cairo',system-ui,sans-serif;}
  .surface{background:var(--surface);}
  .border-line{border-color:var(--line);}
  ::selection{background:var(--gold); color:var(--gold-ink);}
  a{color:var(--teal);}
  input,select,textarea{
    font-family:'Tajawal',sans-serif; background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:var(--radius-sm);
  }
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{
    outline:2px solid var(--teal); outline-offset:2px;
  }
  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}

  /* Header */
  .app-header{
    background:var(--ink); color:var(--paper);
    padding-top:env(safe-area-inset-top,0px);
    position:sticky; top:0; z-index:40;
    box-shadow:var(--shadow-sm);
    position:relative; overflow:hidden;
  }
  .app-header::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(420px 160px at 12% -30%, rgba(231,169,60,0.20), transparent 65%),
      radial-gradient(300px 140px at 92% 120%, rgba(21,122,115,0.28), transparent 70%);
  }
  .app-header > *{ position:relative; z-index:1; }
  .badge-crest{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(155deg,var(--gold),var(--gold-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px -4px rgba(0,0,0,0.4);
    flex-shrink:0;
  }
  .logo-plaque{
    background:#FBF9F4; border-radius:10px; padding:5px 7px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px -4px rgba(0,0,0,0.35); flex-shrink:0;
    height:46px;
  }
  .logo-plaque img{ height:100%; width:auto; object-fit:contain; }
  .header-divider{ width:1px; align-self:stretch; background:rgba(250,247,239,0.16); }
  .site-title{
    background:linear-gradient(90deg, var(--gold) 0%, #F7D48C 45%, var(--gold) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:.2px;
  }
  .site-title-wrap{ position:relative; }
  .site-title-rule{
    height:3px; width:42px; border-radius:99px;
    background:linear-gradient(90deg, var(--gold), transparent);
    margin-top:5px;
  }
  .social-link{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px;
    background:rgba(255,255,255,0.08); color:var(--paper); font-size:13px; font-weight:600;
    transition:background .15s;
  }
  .social-link:hover{ background:rgba(255,255,255,0.16); }
  .section-heading{
    display:flex; align-items:center; gap:9px;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:15.5px;
  }
  .section-heading::before{
    content:""; width:5px; height:18px; border-radius:99px;
    background:linear-gradient(180deg,var(--gold),var(--gold-deep));
    flex-shrink:0;
  }
  .role-pill{
    display:flex; background:rgba(255,255,255,0.08); border-radius:999px; padding:3px; gap:2px;
  }
  .role-pill button{
    border-radius:999px; padding:7px 14px; font-size:13px; font-weight:700;
    color:rgba(250,247,239,0.7); transition:background .15s,color .15s;
    white-space:nowrap;
  }
  .role-pill button[aria-pressed="true"]{background:var(--gold); color:var(--gold-ink);}

  /* Ribbon stats */
  .stat-ribbon{
    background:var(--ink-2); color:var(--paper);
  }
  .stat-item{ padding:14px 20px; position:relative; }
  .stat-item + .stat-item{ border-inline-start:1px solid rgba(250,247,239,0.18); }
  .stat-num{ font-family:'Cairo',sans-serif; font-weight:800; color:var(--gold); font-size:22px; line-height:1; }
  .stat-label{ font-size:12.5px; color:rgba(250,247,239,0.75); margin-top:4px; }

  /* Nav tabs */
  .tab-btn{
    padding:10px 6px; font-weight:700; font-size:14.5px; color:var(--ink-soft);
    border-bottom:3px solid transparent; transition:color .15s,border-color .15s;
  }
  .tab-btn[aria-selected="true"]{ color:var(--ink); border-color:var(--gold); }

  /* Level tabs */
  .level-tab{
    padding:8px 16px; border-radius:999px; font-weight:700; font-size:13.5px;
    border:1px solid var(--line); color:var(--ink-soft); background:var(--surface);
    transition:.15s;
  }
  .level-tab[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  /* Podium */
  .podium-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); position:relative; overflow:hidden;
    display:flex; flex-direction:column; cursor:pointer;
    transition:transform .15s, box-shadow .15s;
  }
  .podium-card:hover{ transform:translateY(-3px); box-shadow:0 16px 34px -14px rgba(46,36,24,0.28); }
  .podium-rank{
    position:absolute; top:14px; inset-inline-start:14px;
    width:38px;height:38px;border-radius:11px; font-family:'Cairo',sans-serif; font-weight:800; font-size:17px;
    display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:0 4px 10px -3px rgba(0,0,0,0.35);
  }
  .rank-1{ background:linear-gradient(155deg,#F3C468,var(--gold-deep)); }
  .rank-2{ background:linear-gradient(155deg,#C9D2D6,var(--silver)); }
  .rank-3{ background:linear-gradient(155deg,#D69B6C,var(--bronze)); }

  /* Rows */
  .init-row{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm); transition:transform .12s, box-shadow .12s;
  }
  .init-row:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .rank-badge{
    width:34px;height:34px;border-radius:50%; background:var(--teal-soft); color:var(--teal);
    font-family:'Cairo',sans-serif; font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px;
    font-size:12.5px; font-weight:700; white-space:nowrap;
  }
  .pill-cat{ background:var(--teal-soft); color:var(--teal); }
  .pill-level{ background:rgba(231,169,60,0.15); color:var(--gold-deep); }
  .pill-pending{ background:var(--coral-soft); color:var(--coral); }
  .pill-approved{ background:var(--green-soft); color:var(--green); }
  .points-tag{
    font-family:'Cairo',sans-serif; font-weight:800; color:var(--gold-deep); font-size:16px;
  }
  :root[data-theme="dark"] .points-tag, :root:not([data-theme="light"]) .points-tag{ }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .points-tag{ color:var(--gold);} }
  :root[data-theme="dark"] .points-tag{ color:var(--gold); }

  .icon-btn{
    width:34px;height:34px;border-radius:9px; display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line); color:var(--ink-soft); background:var(--surface); transition:.15s;
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--paper); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--coral-soft); color:var(--coral); border-color:var(--coral); }
  .icon-btn.edit:hover{ background:var(--teal-soft); color:var(--teal); border-color:var(--teal); }

  .btn{
    font-weight:700; border-radius:var(--radius-sm); padding:10px 18px; font-size:14px;
    display:inline-flex; align-items:center; gap:8px; justify-content:center; transition:.15s; cursor:pointer;
    border:1px solid transparent;
  }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-primary:hover{ background:var(--ink-2); }
  .btn-gold{ background:var(--gold); color:var(--gold-ink); }
  .btn-gold:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ background:var(--paper); }
  .btn-danger{ background:var(--coral); color:#fff; }
  .btn-danger:hover{ filter:brightness(1.06); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .field-label{ font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; display:block; }
  .input-base{ width:100%; padding:9px 12px; font-size:14px; }

  .star{ color:var(--line); }
  .star.filled{ color:var(--gold); }

  /* modal */
  .modal-backdrop{ background:rgba(14,27,34,0.55); backdrop-filter:blur(2px); }
  .modal-panel{
    background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .modal-enter{ animation:modalIn .18s ease-out; }
  @keyframes modalIn{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;} }

  .link-chip{
    display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid var(--line);
    border-radius:var(--radius-sm); font-size:13.5px; font-weight:600; color:var(--teal);
    background:var(--teal-soft); transition:.15s;
  }
  .link-chip:hover{ filter:brightness(0.97); }

  .toast{
    background:var(--ink); color:var(--paper); border-radius:var(--radius-md); padding:13px 18px;
    box-shadow:var(--shadow); font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px;
    animation:toastIn .2s ease-out;
  }
  @keyframes toastIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

  @media (max-width:640px){
    .stat-item{ padding:12px 14px; }
    .stat-num{ font-size:18px; }
  }
  .empty-state{
    border:1.5px dashed var(--line); border-radius:var(--radius-lg); padding:48px 20px; text-align:center; color:var(--ink-soft);
  }
  .skeleton{ background:linear-gradient(90deg,var(--line) 25%, var(--paper) 37%, var(--line) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--radius-sm); }
  @keyframes sk{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
  .scrollbar-thin{ scrollbar-width:thin; }
  /* ===== Refinement layer: typography, focus, controls, motion, responsive ===== */
  html{-webkit-text-size-adjust:100%;}
  body{font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{line-height:1.35;}
  :focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-deep);outline-offset:1px;border-color:var(--gold-deep);}
  .skip-link{position:absolute;inset-inline-start:12px;top:-64px;z-index:100;background:var(--gold);color:var(--gold-ink);padding:10px 16px;border-radius:var(--radius-sm);font-weight:700;transition:top .2s;}
  .skip-link:focus{top:8px;}
  .app-header{background:linear-gradient(180deg,var(--ink),var(--ink-2));}
  .role-pill button{min-height:40px;padding:8px 20px;}
  .role-pill button:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.12);color:var(--paper);}
  .tab-btn{padding:12px 10px;font-size:15px;}
  .tab-btn:hover{color:var(--ink);}
  .stat-item{padding:16px 22px;}
  .level-tab{min-height:38px;}
  .level-tab:hover{border-color:var(--gold);color:var(--ink);}
  .btn{min-height:42px;}
  .btn:active:not(:disabled){transform:translateY(1px);}
  .btn-gold{box-shadow:0 2px 0 var(--gold-deep);}
  .btn-gold:hover{filter:none;background:#F0A044;}
  .btn-primary:hover,.btn-danger:hover{box-shadow:var(--shadow-sm);}
  select.input-base,input.input-base{min-height:42px;}
  .icon-btn{width:38px;height:38px;}
  .podium-card:nth-child(1){border-top:3px solid var(--gold);}
  .podium-card,.init-row{border-color:var(--line);}
  .logo-plaque{border:1px solid var(--line);}
  @media (max-width:640px){
    body{font-size:14.5px;}
    .stat-item{min-width:132px;padding:14px 16px;}
    .modal-panel{border-radius:16px;}
    .role-pill button{padding:8px 14px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
  }
</style>
</head>

<div id="app"></div>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = "initiatives";
let seedAttempted = false;

function startRealtimeSync(){
  db.collection(COLLECTION).onSnapshot(
    (snapshot)=>{
      state.loading = false;
      state.syncError = null;
      const docs = [];
      snapshot.forEach(doc => docs.push(doc.data()));
      if(docs.length === 0 && !seedAttempted){
        seedAttempted = true;
        const seeded = seedData();
        const batch = db.batch();
        seeded.forEach(item => batch.set(db.collection(COLLECTION).doc(item.id), item));
        batch.commit().catch(e => console.warn("تعذرت تهيئة البيانات الأولية", e));
        return; // سيصل التحديث تلقائياً عبر onSnapshot بعد نجاح الكتابة
      }
      docs.sort((a,b)=> b.createdAt - a.createdAt);
      state.initiatives = docs;
      render();
    },
    (err)=>{
      console.warn("تعذرت مزامنة البيانات", err);
      state.loading = false;
      state.syncError = (err && err.code === 'permission-denied')
        ? "تم رفض الوصول إلى قاعدة البيانات. تحقّقي من قواعد الأمان (Rules) في مشروع Firebase."
        : "تعذر الاتصال بقاعدة البيانات. تحقّقي من الاتصال بالإنترنت ثم أعيدي تحميل الصفحة.";
      render();
    }
  );
}

function saveItem(item){
  return db.collection(COLLECTION).doc(item.id).set(item)
    .catch(e=>{ console.warn("تعذر الحفظ", e); showToast('تعذر حفظ التغييرات، تحققي من اتصالك بالإنترنت.', 'error'); });
}
function updateItem(id, patch){
  return db.collection(COLLECTION).doc(id).update(patch)
    .catch(e=>{ console.warn("تعذر التحديث", e); showToast('تعذر حفظ التغييرات، تحققي من اتصالك بالإنترنت.', 'error'); });
}
function deleteItem(id){
  return db.collection(COLLECTION).doc(id).delete()
    .catch(e=>{ console.warn("تعذر الحذف", e); showToast('تعذر حذف المبادرة، تحققي من اتصالك بالإنترنت.', 'error'); });
}

function humanFileSize(bytes){
  if(bytes < 1024) return bytes + ' بايت';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' كيلوبايت';
  return (bytes/(1024*1024)).toFixed(1) + ' ميجابايت';
}

/* ===================== DERIVED / FILTER LOGIC ===================== */
function visibleBase(){
  // What each role is allowed to see on the leaderboard/board tab
  if(state.role === 'admin') return state.initiatives.slice();
  if(state.role === 'teacher') return state.initiatives.filter(i => i.status === 'approved' || i.teacher === state.teacherName);
  return state.initiatives.filter(i => i.status === 'approved');
}

function applyFilters(list){
  const f = state.filters;
  return list.filter(i=>{
    if(f.level !== 'all' && i.level !== f.level) return false;
    if(f.grade && i.grade !== f.grade) return false;
    if(f.section && i.section !== f.section) return false;
    if(f.subject && i.subject !== f.subject) return false;
    if(f.teacher && i.teacher !== f.teacher) return false;
    if(f.category && i.category !== f.category) return false;
    if(f.minRating && i.rating < f.minRating) return false;
    if(f.q){
      const q = f.q.trim();
      if(q && !(i.title.includes(q) || i.teacher.includes(q) || i.description.includes(q))) return false;
    }
    return true;
  });
}

function sortedList(){
  const base = applyFilters(visibleBase());
  base.sort((a,b)=> state.sortDir === 'desc' ? b.points - a.points : a.points - b.points);
  return base;
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function gradeLabel(item){
  return item.section ? `${item.grade} - شعبة ${item.section}` : item.grade;
}
function fmtDate(ts){
  try{ return new Date(ts).toLocaleDateString('ar-SA-u-nu-latn', { year:'numeric', month:'long', day:'numeric' }); }
  catch(e){ return new Date(ts).toLocaleDateString(); }
}
function stars(rating, size){
  size = size||15;
  let out = '<div class="flex items-center gap-0.5" aria-label="التقييم '+rating+' من 5">';
  for(let k=1;k<=5;k++){
    out += `<span class="star ${k<=rating?'filled':''}">${ICONS.star}</span>`;
  }
  out += '</div>';
  return out;
}

/* ===================== MINE (TEACHER) TAB ===================== */
function renderMine(){
  const mine = state.initiatives.filter(i=>i.teacher===state.teacherName).sort((a,b)=>b.createdAt-a.createdAt);

function isDataUrl(url){ return typeof url === 'string' && url.slice(0,5) === 'data:'; }
function estimateDataUrlSize(url){
  const idx = url.indexOf(',');
  const b64 = idx>-1 ? url.slice(idx+1) : url;
  return Math.round(b64.length * 3/4);
}

function renderLinkFields(label, url, isFile){
  if(isFile){
    const sizeLabel = url ? humanFileSize(estimateDataUrlSize(url)) : '';
    return `
    <div class="flex items-center gap-2 link-row" data-file="1">
      <input class="input-base flex-1 link-label" placeholder="اسم الملف" value="${esc(label||'')}">
      <input type="hidden" class="link-url" value="${esc(url||'')}">
      <span class="pill pill-cat shrink-0">📎 ملف مرفق${ sizeLabel ? ' ('+sizeLabel+')' : '' }</span>
      <button type="button" class="icon-btn danger shrink-0 btnRemoveLink" aria-label="إزالة المرفق">${ICONS.x}</button>
    </div>`;
  }
  return `
  <div class="flex items-center gap-2 link-row">
    <input class="input-base flex-1 link-label" placeholder="اسم الرابط (مثال: ألبوم الصور)" value="${esc(label||'')}">
    <input class="input-base flex-[1.4] link-url" placeholder="https://" value="${esc(url||'')}">
    <button type="button" class="icon-btn danger shrink-0 btnRemoveLink" aria-label="إزالة الرابط">${ICONS.x}</button>
  </div>`;
}

/* ===================== EVENTS ===================== */
function bindEvents(){
  const root = document.getElementById('app');

  root.querySelectorAll('[data-role]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.getAttribute('data-role');
      if(target === 'admin' && !state.adminUnlocked){
        state.modal = { type:'adminAuth', payload:null };
        render();
        return;
      }
      if(target !== 'admin') state.adminUnlocked = false; // الخروج من وضع المشرف يلغي الجلسة
      state.role = target;
      state.tab = 'board';
      render();
    });
  });

  const adminAuthForm = document.getElementById('adminAuthForm');
  if(adminAuthForm) adminAuthForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const val = document.getElementById('adminPass').value;
    if(val === ADMIN_PASSCODE){
      state.adminUnlocked = true;
      state.role = 'admin';
      state.tab = 'board';
      state.modal = null;
      render();
    }else{
      const err = document.getElementById('adminAuthErr');
      if(err) err.classList.remove('hidden');
      document.getElementById('adminPass').select();
    }
  });

  root.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.tab = btn.getAttribute('data-tab'); render(); });
  });

  root.querySelectorAll('[data-level]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.filters.level = btn.getAttribute('data-level'); render(); });
  });

  const btnSortDir = document.getElementById('btnSortDir');
  if(btnSortDir) btnSortDir.addEventListener('click', ()=>{ state.sortDir = state.sortDir==='desc'?'asc':'desc'; render(); });

  const btnAdd = document.getElementById('btnAdd');
  if(btnAdd) btnAdd.addEventListener('click', ()=>{ state.modal = { type:'form', payload:null }; render(); });

  ['fltQ','fltGrade','fltSection','fltSubject','fltTeacher','fltCategory','fltRating'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const key = { fltQ:'q', fltGrade:'grade', fltSection:'section', fltSubject:'subject', fltTeacher:'teacher', fltCategory:'category', fltRating:'minRating' }[id];
    const evt = id==='fltQ' ? 'input' : 'change';
    el.addEventListener(evt, ()=>{
      state.filters[key] = key==='minRating' ? Number(el.value) : el.value;
      render();
      if(id==='fltQ'){ const f = document.getElementById('fltQ'); if(f){ f.focus(); f.selectionStart = f.selectionEnd = f.value.length; } }
    });
  });

  const btnClear = document.getElementById('btnClearFilters');
  if(btnClear) btnClear.addEventListener('click', ()=>{ state.filters = { level:state.filters.level, grade:'', section:'', subject:'', teacher:'', category:'', minRating:0, q:'' }; render(); });

  root.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.modal = { type:'detail', payload: el.getAttribute('data-open') }; render(); });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); state.modal = { type:'detail', payload: el.getAttribute('data-open') }; render(); } });
  });

  root.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); state.modal = { type:'form', payload:{ id: el.getAttribute('data-edit') } }; render(); });
  });

  root.querySelectorAll('[data-delete]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); state.modal = { type:'delete', payload: el.getAttribute('data-delete') }; render(); });
  });

  root.querySelectorAll('[data-approve]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-approve');
      const item = state.initiatives.find(i=>i.id===id);
      if(item){ updateItem(id, { status:'approved' }); showToast('تم اعتماد المبادرة ونشرها.'); }
    });
  });

  root.querySelectorAll('[data-points]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-id');
      const delta = Number(el.getAttribute('data-points'));
      const item = state.initiatives.find(i=>i.id===id);
      if(item){ updateItem(id, { points: Math.max(0, item.points + delta) }); }
    });
  });

  root.querySelectorAll('[data-close-modal]').forEach(el=>{
    el.addEventListener('click', (e)=>{ if(e.target === el || el.hasAttribute('data-close-modal')){ if(e.target===el.querySelector) {} state.modal = null; render(); } });
  });

  const confirmDeleteBtn = document.getElementById('confirmDelete');
  if(confirmDeleteBtn) confirmDeleteBtn.addEventListener('click', ()=>{
    const id = confirmDeleteBtn.getAttribute('data-id');
    deleteItem(id);
    state.modal = null;
    showToast('تم حذف المبادرة.');
    render();
  });

  const noteForm = document.getElementById('noteForm');
  if(noteForm) noteForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const id = noteForm.getAttribute('data-id');
    const txt = document.getElementById('noteText').value.trim();
    if(!txt) return;
    const item = state.initiatives.find(i=>i.id===id);
    if(item){
      const newNotes = (item.notes || []).concat([{ author:'المشرف', text: txt, date: Date.now() }]);
      updateItem(id, { notes: newNotes });
      showToast('تمت إضافة الملاحظة.');
      state.modal = { type:'detail', payload:id };
      render();
    }
  });

  const btnAddLink = document.getElementById('btnAddLink');
  if(btnAddLink) btnAddLink.addEventListener('click', ()=>{
    const wrap = document.getElementById('linksWrap');
    const div = document.createElement('div');
    div.innerHTML = renderLinkFields('', '', false);
    const node = div.firstElementChild;
    wrap.appendChild(node);
    bindLinkRemovers();
  });
  bindLinkRemovers();

  const btnAttachFile = document.getElementById('btnAttachFile');
  const fileAttachInput = document.getElementById('fileAttachInput');
  if(btnAttachFile && fileAttachInput) btnAttachFile.addEventListener('click', ()=> fileAttachInput.click());
  if(fileAttachInput) fileAttachInput.addEventListener('change', ()=> handleAttachedFiles(fileAttachInput.files, fileAttachInput));

  const btnAttachFolder = document.getElementById('btnAttachFolder');
  const folderAttachInput = document.getElementById('folderAttachInput');
  if(btnAttachFolder && folderAttachInput) btnAttachFolder.addEventListener('click', ()=> folderAttachInput.click());
  if(folderAttachInput) folderAttachInput.addEventListener('change', ()=> handleAttachedFiles(folderAttachInput.files, folderAttachInput));

  const form = document.getElementById('initiativeForm');
  if(form) form.addEventListener('submit', onSubmitForm);
}

function handleAttachedFiles(fileList, inputEl){
  const wrap = document.getElementById('linksWrap');
  if(!wrap || !fileList || !fileList.length) return;
  Array.from(fileList).forEach(file=>{
    if(file.size > MAX_ATTACHMENT_BYTES){
      showToast(`تم تجاوز الحد الأقصى (700 كيلوبايت) للملف "${file.name}"، لم تتم إضافته.`, 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      const displayName = file.webkitRelativePath || file.name;
      const div = document.createElement('div');
      div.innerHTML = renderLinkFields(displayName, reader.result, true);
      wrap.appendChild(div.firstElementChild);
      bindLinkRemovers();
    };
    reader.onerror = ()=>{ showToast(`تعذرت قراءة الملف "${file.name}".`, 'error'); };
    reader.readAsDataURL(file);
  });
  if(inputEl) inputEl.value = '';
}

function bindLinkRemovers(){
  document.querySelectorAll('.btnRemoveLink').forEach(btn=>{
    btn.onclick = ()=>{ btn.closest('.link-row').remove(); };
  });
}

function onSubmitForm(e){
  e.preventDefault();
  const form = e.target;
  const id = form.getAttribute('data-id');
  const isAdmin = state.role === 'admin';

  const title = document.getElementById('f_title').value.trim();
  const teacher = document.getElementById('f_teacher').value.trim();
  const grade = document.getElementById('f_grade').value;
  const section = document.getElementById('f_section').value;
  const subject = document.getElementById('f_subject').value;
  const category = document.getElementById('f_category').value;
  const level = form.querySelector('input[name="f_level"]:checked').value;
  const description = document.getElementById('f_desc').value.trim();

  if(!title || !teacher || !grade || !subject || !category){
    showToast('يرجى تعبئة جميع الحقول المطلوبة.', 'error');
    return;
  }

  if(state.role === 'teacher' && teacher !== state.teacherName){
    state.teacherName = teacher;
    try{ localStorage.setItem(TEACHER_NAME_KEY, teacher); }catch(err){}
  }

  const links = Array.from(form.querySelectorAll('.link-row')).map(row=>({
    label: row.querySelector('.link-label').value.trim(),
    url: row.querySelector('.link-url').value.trim(),
  })).filter(l=>l.url);

  let points, rating, status;
  if(isAdmin){
    points = Math.max(0, Number(document.getElementById('f_points').value) || 0);
    rating = Math.max(0, Math.min(5, Number(document.getElementById('f_rating').value) || 0));
    status = document.getElementById('f_approved').checked ? 'approved' : 'pending';
  }

  let finalItem;
  if(id){
    const existing = state.initiatives.find(i=>i.id===id);
    finalItem = Object.assign({}, existing, { title, teacher, grade, section, subject, category, level, description, links });
    if(isAdmin){ finalItem.points = points; finalItem.rating = rating; finalItem.status = status; }
  }else{
    finalItem = {
      id: uid(), title, teacher, grade, section, subject, category, level, description, links,
      points: isAdmin ? points : 0,
      rating: isAdmin ? rating : 0,
      status: isAdmin ? status : 'pending',
      notes: [],
      createdAt: Date.now(),
    };
  }

  const approxBytes = JSON.stringify(finalItem).length;
  if(approxBytes > 900*1024){
    showToast('الحجم الإجمالي للمرفقات كبير جداً على قاعدة البيانات. أزيلي بعض الملفات أو استخدمي رابط Google Drive بدلاً منها.', 'error');
    return;
  }

  saveItem(finalItem);
  showToast(id ? 'تم حفظ التعديلات.' : (isAdmin ? 'تمت إضافة المبادرة.' : 'تم إرسال المبادرة للمراجعة.'));
  state.modal = null;
  render();
}

/* ===================== INIT ===================== */
render();
startRealtimeSync();
</script>
</body>
</html>
